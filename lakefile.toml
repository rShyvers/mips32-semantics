name = "Semantics"
version = "0.1.0"
keywords = ["mips", "semantics", "formal-verification"]
license = "Apache-2.0"
# Targets.
#  * `Checked` (default): the library `lake check` kernel-replays. It imports the model, every spec file
#    (through the index `Semantics.Specs.StepSpec`), the comparator solution module `Semantics.StatementsProofs`,
#    the facts files and the tests; see `Checked.lean`. No `sorry` is reachable from it.
#  * `DiffHarness` (default): the corpus-vs-MARS executable (needs java).
#  * `Semantics`: the full library (same modules as `Checked`); `lake build Semantics`.
#  * `EquivHarness`, `MipsRun`: executables, built explicitly (see the note below).
# `Semantics.Statements` (the statements-only challenge module of `lake comparator`, see `comparator.json`) is
# the one module with a `sorry`, by design; no library root imports it, so no build or `lake check` sees it.
defaultTargets = ["Checked", "DiffHarness"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Semantics"

[[lean_lib]]
name = "Checked"

[[lean_exe]]
name = "DiffHarness"
root = "DiffHarness"

[[lean_exe]]
name = "EquivHarness"
root = "EquivHarness"

# Deliberately *not* in `defaultTargets`, same as `EquivHarness` above: `lake
# check` combines every default-target exe's root module into one
# `Lean.importModules` call (see `Lake/CLI/Main.lean`'s `checkExport`), and
# since every `lean_exe` root must define a top-level `def main` (Lake's
# literal entry-point convention), a second default-target exe collides with
# `DiffHarness`'s `main` ("environment already contains 'main' from
# DiffHarness") and fails `lake check` outright. Build this one explicitly:
# `lake build MipsRun` (or `lake exe MipsRun`).
[[lean_exe]]
name = "MipsRun"
root = "MipsRun"

