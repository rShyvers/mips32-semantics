name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI runs the same gate as a developer (scripts/gate.sh, ten steps: see scripts/README.md).
# NOT YET RUN: this workflow was written without access to GitHub Actions; treat it as untested.
#
# The manual texts (docs/spec/manuals/*.txt) are not committed (copyright, .gitignore). Two consequences:
#  * step 9 (manuals selftest) is a SKIP when the texts are absent; a SKIP does not fail the gate
#    (gate.sh exits 0 iff no step FAILed);
#  * step 8 (trace) regenerates docs/TRACE.md, whose manual column needs the texts, so it can only pass
#    when they are present. The fetch step below tries to provide them (best effort, from the download
#    locations in docs/spec/manuals/fetch.sh); if it fails, step 8 fails and the log says why.

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean toolchain (pinned in lean-toolchain)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the differential-oracle tools (QEMU MIPS system emulator + LLVM) and pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-mips llvm lld poppler-utils
          echo "ORACLE_LLVM_DIR=$(dirname "$(readlink -f "$(command -v llvm-mc || ls /usr/lib/llvm-*/bin/llvm-mc | tail -1)")")" >> "$GITHUB_ENV"
      - name: Restore .lake cache (packages + mathlib build)
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lean-toolchain') }}
      - name: Fetch mathlib build cache (no-op when restored from cache)
        run: lake exe cache get
      - name: Fetch the manuals (best effort; without them step 9 is a SKIP and step 8 cannot pass)
        continue-on-error: true
        run: docs/spec/manuals/fetch.sh
      - name: Gate (forbidden, build, check, comparator, DiffHarness, EquivHarness, oracle, trace, manuals, hygiene)
        run: scripts/gate.sh
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: .gate/
